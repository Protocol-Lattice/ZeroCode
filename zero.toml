[package]
name = "zero-coding-tui"
version = "0.1.0"
license = "MIT"

[targets.cli]
kind = "exe"
main = "src/main.0"
defaultTarget = "linux-musl-x64"
devTarget = "host"
releaseProfile = "release-small"

[deps]

[c.libs.process]
headers = ["native/exit.h"]
lib = ["native/http_stream.c", "native/session_log.c", "native/learning_store.c", "native/peer_network.c"]
link = ["c", "curl", "pthread"]

[profiles.dev]
inherits = "dev"

[profiles.release-small]
inherits = "release-small"
