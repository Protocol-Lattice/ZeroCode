name: Prebuilds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuilds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_NAME: zero-code-${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev
      - name: Build the pinned compiler and test
        run: make setup test
      - name: Package the native binary
        run: |
          package_dir="$RUNNER_TEMP/$PACKAGE_NAME"
          mkdir -p "$package_dir"
          cp dist/zero-code install.sh README.md LICENSE "$package_dir/"
          chmod 755 "$package_dir/zero-code" "$package_dir/install.sh"
          COPYFILE_DISABLE=1 tar -czf "dist/$PACKAGE_NAME.tar.gz" -C "$RUNNER_TEMP" "$PACKAGE_NAME"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$PACKAGE_NAME.tar.gz" > "$PACKAGE_NAME.tar.gz.sha256"
          else
            shasum -a 256 "$PACKAGE_NAME.tar.gz" > "$PACKAGE_NAME.tar.gz.sha256"
          fi
      - name: Test installation from the archive
        run: |
          unpack_dir="$RUNNER_TEMP/zero-code-unpacked"
          install_prefix="$RUNNER_TEMP/zero-code-install"
          mkdir -p "$unpack_dir"
          tar -xzf "dist/$PACKAGE_NAME.tar.gz" -C "$unpack_dir"
          cd "$unpack_dir/$PACKAGE_NAME"
          sh ./install.sh --binary ./zero-code --prefix "$install_prefix" --no-modify-path
          cd "$RUNNER_TEMP"
          "$install_prefix/bin/zero-code" --version
          "$install_prefix/bin/zero-code" --self-test
          sh "$unpack_dir/$PACKAGE_NAME/install.sh" --uninstall --prefix "$install_prefix"
      - name: Upload prebuild
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.tar.gz
            dist/${{ env.PACKAGE_NAME }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: zero-code-*
          path: release
          merge-multiple: true
      - name: Verify checksums and publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          else
            release_flags=()
            case "$RELEASE_TAG" in
              *-*) release_flags+=(--prerelease) ;;
            esac
            gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
              --verify-tag --generate-notes "${release_flags[@]}"
          fi
