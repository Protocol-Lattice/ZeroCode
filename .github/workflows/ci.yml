name: Build and install

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev
      - name: Build the pinned compiler and test
        run: make setup test
      - name: Install and run from another directory
        shell: sh
        run: |
          make install PREFIX="$RUNNER_TEMP/zero-install" INSTALL_FLAGS=--no-modify-path
          export PATH="$RUNNER_TEMP/zero-install/bin:$PATH"
          cd "$RUNNER_TEMP"
          zero-coding --version
          zero-coding --self-test
      - name: Uninstall
        run: make uninstall PREFIX="$RUNNER_TEMP/zero-install"
